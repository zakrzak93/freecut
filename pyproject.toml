[project]
name = "freecut"
version = "0.1.0"
description = "Conversation-driven video editor skill for Codex and Claude Code with local dialogue auditing and editable delivery"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests",
    "librosa",
    "matplotlib",
    "pillow",
    "numpy",
]

[project.optional-dependencies]
# Local Whisper transcription (default backend). Pick one:
#   mlx-whisper is fastest on Apple Silicon.
#   faster-whisper works on Linux / Windows / CPU / NVIDIA.
whisper-mlx = ["mlx-whisper"]
whisper-fast = ["faster-whisper"]
# Optional local sound-event evidence for coughing/throat clearing; never auto-cuts.
audio-events = ["torch>=2.6", "torchaudio>=2.6", "transformers>=4.40,<5"]
animations = ["manim"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
